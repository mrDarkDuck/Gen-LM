<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Dynamic Baby LLM Graph (Real Embeddings)</title>
    <style>
        body { margin: 0; background: #0f172a; color: #fff; font-family: monospace; overflow: hidden; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(15, 23, 42, 0.95); padding: 20px; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 350px;}
        h3 { margin-top: 0; color: #60a5fa; }
        input[type="text"] { width: 100%; padding: 10px; background: #1e293b; border: 1px solid #475569; color: #fff; font-family: monospace; border-radius: 6px; box-sizing: border-box; margin-bottom: 10px;}
        button { width: 100%; padding: 10px; background: #3b82f6; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-bottom: 8px;}
        button:hover { background: #2563eb; }
        button:disabled { background: #475569; cursor: not-allowed; }
        
        .btn-row { display: flex; gap: 8px; }
        .btn-row button { flex: 1; }
        .btn-conflict { background: #f59e0b; color: #000; }
        .btn-conflict:hover { background: #d97706; }
        
        #log { margin-top: 15px; font-size: 12px; color: #94a3b8; height: 150px; overflow-y: auto; border-top: 1px solid #334155; padding-top: 10px;}
        #status { font-size: 11px; color: #fbbf24; margin-bottom: 10px; min-height: 15px;}
        
        .slider-container { margin: 10px 0; font-size: 12px; color: #cbd5e1; }
        input[type="range"] { width: 100%; margin-top: 5px; cursor: pointer; }
        .slider-val { color: #60a5fa; font-weight: bold; float: right;}
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="ui">
        <h3>Feed the Brain</h3>
        <div id="status">Loading embedding model...</div>
        
        <input type="text" id="wordInput" placeholder="Enter text (e.g. 'tokio')" autocomplete="off" disabled>
        <button id="feedBtn" disabled>Add Node (Embed)</button>
        
        <div class="btn-row">
            <button id="shatterBtn" disabled style="background:#475569;">Shatter Target</button>
            <button id="conflictBtn" disabled class="btn-conflict">Spawn Conflict</button>
        </div>

        <div class="slider-container">
            Merge Threshold <span id="thresholdVal" class="slider-val">0.70</span>
            <input type="range" id="thresholdSlider" min="0.4" max="0.95" step="0.01" value="0.70" disabled>
        </div>

        <div id="log">
            <div>[System] Neural network initialized...</div>
            <div style="color:#f59e0b">Click frozen (gray) nodes to SHATTER them.</div>
        </div>
    </div>
    <canvas id="canvas"></canvas>

<script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';
    env.allowLocalModels = false;

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('status');
    const inputEl = document.getElementById('wordInput');
    const feedBtn = document.getElementById('feedBtn');
    const shatterBtn = document.getElementById('shatterBtn');
    const conflictBtn = document.getElementById('conflictBtn');
    const slider = document.getElementById('thresholdSlider');
    const thresholdVal = document.getElementById('thresholdVal');
    
    let mergeThreshold = 0.70;
    let width, height;
    let nodes = [];
    let nextId = 0;
    let extractor = null;
    let isProcessing = false;
    let selectedForShatter = null;

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    function log(msg, color = "") {
        let div = document.createElement('div');
        div.innerText = "> " + msg;
        if (color) div.style.color = color;
        logEl.appendChild(div);
        logEl.scrollTop = logEl.scrollHeight;
    }

    async function initModel() {
        try {
            extractor = await pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2', { quantized: true });
            statusEl.innerText = "✅ Model loaded. Ready.";
            inputEl.disabled = false;
            feedBtn.disabled = false;
            slider.disabled = false;
            log("Embedding model loaded.");
        } catch (e) {
            statusEl.innerText = "❌ Error loading model.";
            console.error(e);
        }
    }

    // --- L2-НОРМАЛИЗАЦИЯ ВЕКТОРА (Исправление 1) ---
    function normalizeVec(vec) {
        let sumSq = 0;
        for (let v of vec) sumSq += v * v;
        const norm = Math.sqrt(sumSq) || 1;
        return vec.map(v => v / norm);
    }

    function cosineSimilarity(vecA, vecB) {
        let dot = 0, magA = 0, magB = 0;
        for (let i = 0; i < vecA.length; i++) {
            dot += vecA[i] * vecB[i];
            magA += vecA[i] * vecA[i];
            magB += vecB[i] * vecB[i];
        }
        if (magA === 0 || magB === 0) return 0;
        return dot / (Math.sqrt(magA) * Math.sqrt(magB));
    }

    class Node {
        constructor(text, vec, energy=0) {
            this.id = nextId++;
            this.text = text;
            this.displayWord = text.length > 18 ? text.substring(0, 16) + "..." : text;
            this.vec = vec;
            this.energy = energy;
            this.W = 0; // 0 = active, 1 = frozen (merged), -1 = archived (shattered)
            this.parents = []; // Ссылки на родителей для Shatter
            this.edges = [];
            this.x = width/2 + (Math.random()-0.5)*200;
            this.y = height/2 + (Math.random()-0.5)*200;
            this.vx = 0; this.vy = 0;
        }
    }

    async function getEmbedding(text) {
        if (!extractor) return null;
        try {
            const output = await extractor(text, { pooling: 'mean', normalize: true });
            return Array.from(output.data);
        } catch (e) { return null; }
    }

    // --- СПАВН ЧЕРЕЗ КОНФЛИКТ (Исправление 2) ---
    async function spawnConflict() {
        // Ищем два активных узла с низким сходством
        let activeNodes = nodes.filter(n => n.W === 0);
        if (activeNodes.length < 2) {
            log("Need at least 2 active nodes for conflict.", "#f87171");
            return;
        }

        let u = activeNodes[0], v = activeNodes[1];
        let minSim = 1.0;
        
        // Ищем максимально далекую пару
        for (let i = 0; i < activeNodes.length; i++) {
            for (let j = i+1; j < activeNodes.length; j++) {
                let sim = cosineSimilarity(activeNodes[i].vec, activeNodes[j].vec);
                if (sim < minSim) {
                    minSim = sim;
                    u = activeNodes[i];
                    v = activeNodes[j];
                }
            }
        }

        if (minSim > 0.5) {
            log("No strong conflicts found (all nodes are too similar).", "#f87171");
            return;
        }

        // Создаем разностный вектор x_z = (x_u - x_v) / ||x_u - x_v||
        let diffVec = u.vec.map((val, idx) => val - v.vec[idx]);
        let newVec = normalizeVec(diffVec);

        let newNode = new Node(`Conflict`, newVec, 0);
        newNode.x = (u.x + v.x) / 2;
        newNode.y = (u.y + v.y) / 2;
        newNode.parents = [u, v];
        
        // Добавляем связи
        newNode.edges.push({ target: u, weight: 1 });
        newNode.edges.push({ target: v, weight: 1 });
        u.edges.push({ target: newNode, weight: 1 });
        v.edges.push({ target: newNode, weight: 1 });

        nodes.push(newNode);
        log(`⚡ SPAWNED CONFLICT: (${u.text} - ${v.text})`, "#f59e0b");
    }

    // --- РАСПАД (SHATTER) (Исправление 3) ---
    function shatterNode(n) {
        if (n.W !== 1) return; // Только замороженные узлы можно распаковать
        
        n.W = -1; // Архивируем узел (он остается на экране, но деактивируется)
        log(`💥 SHATTERED: ${n.text}`, "#c084fc");
        
        // Размораживаем родителей
        if (n.parents && n.parents.length > 0) {
            n.parents.forEach(p => {
                if (p.W === 1) p.W = 0;
                log(`↩️ Unfroze parent: ${p.text}`, "#4ade80");
            });
        }
    }

    async function feedText() {
        if (isProcessing || !extractor) return;
        let text = inputEl.value.toLowerCase().trim();
        if (!text) return;
        
        isProcessing = true;
        feedBtn.disabled = true;
        statusEl.innerText = "Computing...";
        
        let existing = nodes.find(n => n.text === text && n.W === 0);
        if (!existing) {
            let vec = await getEmbedding(text);
            if (vec) {
                let node = new Node(text, vec);
                nodes.push(node);
                log(`✨ Embedded: "${text}"`);
            }
        } else {
            log(`Node "${text}" already active.`);
        }
        
        inputEl.value = '';
        statusEl.innerText = "✅ Ready.";
        feedBtn.disabled = false;
        isProcessing = false;
    }

    feedBtn.addEventListener('click', feedText);
    inputEl.addEventListener('keypress', (e) => { if (e.key === 'Enter') feedText(); });
    conflictBtn.addEventListener('click', spawnConflict);
    
    // Клик по холсту (для Shatter)
    canvas.addEventListener('mousedown', (e) => {
        const rect = canvas.getBoundingClientRect();
        let mx = e.clientX - rect.left;
        let my = e.clientY - rect.top;
        
        for (let i = nodes.length - 1; i >= 0; i--) {
            let n = nodes[i];
            let r = 15 + n.energy * 10;
            if (Math.hypot(mx - n.x, my - n.y) < r) {
                if (n.W === 1) shatterNode(n);
                break;
            }
        }
    });

    slider.addEventListener('input', (e) => {
        mergeThreshold = parseFloat(e.target.value);
        thresholdVal.innerText = mergeThreshold.toFixed(2);
    });

    function updateDynamics() {
        let merged = false;
        for (let i = 0; i < nodes.length; i++) {
            for (let j = i+1; j < nodes.length; j++) {
                let n1 = nodes[i], n2 = nodes[j];
                // Слияние только активных узлов (W === 0) и с одинаковой энергией
                if (n1.W !== 0 || n2.W !== 0 || n1.energy !== n2.energy || n1.energy >= 3) continue;
                
                let sim = cosineSimilarity(n1.vec, n2.vec);
                if (sim > mergeThreshold) {
                    // L2-нормализация (Исправление 1)
                    let sumVec = n1.vec.map((v, idx) => v + n2.vec[idx]);
                    let newVec = normalizeVec(sumVec);
                    
                    let newNode = new Node(`(${n1.text}+${n2.text})`, newVec, n1.energy + 1);
                    newNode.displayWord = newNode.energy === 1 ? `E1_Concept` : (newNode.energy === 2 ? `E2_Meta` : `E3_Abstract`);
                    newNode.x = (n1.x + n2.x) / 2;
                    newNode.y = (n1.y + n2.y) / 2;
                    newNode.parents = [n1, n2];

                    n1.W = 1; n2.W = 1;
                    
                    // Устранение дублирования рёбер (Исправление 2)
                    let allEdges = [...n1.edges, ...n2.edges];
                    allEdges.forEach(e => {
                        if (e.target.W === 0 && e.target !== n1 && e.target !== n2) {
                            const existing = newNode.edges.find(ex => ex.target.id === e.target.id);
                            if (existing) {
                                existing.weight += e.weight; // Суммируем вес
                            } else {
                                newNode.edges.push({ target: e.target, weight: e.weight });
                                e.target.edges.push({ target: newNode, weight: e.weight });
                            }
                        }
                    });
                    
                    nodes.push(newNode);
                    log(`🧬 MERGED: ${n1.text} + ${n2.text} (Sim: ${sim.toFixed(2)})`);
                    merged = true;
                    break;
                }
            }
            if (merged) break;
        }
    }

    function updatePhysics() {
        for (let i = 0; i < nodes.length; i++) {
            for (let j = i + 1; j < nodes.length; j++) {
                let dx = nodes[i].x - nodes[j].x;
                let dy = nodes[i].y - nodes[j].y;
                let dist = Math.sqrt(dx*dx + dy*dy) || 1;
                let force = 2000 / (dist * dist);
                nodes[i].vx += (dx/dist) * force; nodes[i].vy += (dy/dist) * force;
                nodes[j].vx -= (dx/dist) * force; nodes[j].vy -= (dy/dist) * force;
            }
        }
        nodes.forEach(n => {
            n.edges.forEach(e => {
                let dx = e.target.x - n.x;
                let dy = e.target.y - n.y;
                let dist = Math.sqrt(dx*dx + dy*dy) || 1;
                let force = (dist - 120) * 0.02;
                n.vx += (dx/dist) * force; n.vy += (dy/dist) * force;
                e.target.vx -= (dx/dist) * force; e.target.vy -= (dy/dist) * force;
            });
        });
        nodes.forEach(n => {
            n.x += n.vx; n.y += n.vy;
            n.vx *= 0.85; n.vy *= 0.85;
            n.x = Math.max(30, Math.min(width - 30, n.x));
            n.y = Math.max(30, Math.min(height - 30, n.y));
        });
    }

    function draw() {
        ctx.clearRect(0, 0, width, height);
        
        // Рисуем ребра
        nodes.forEach(n => {
            n.edges.forEach(e => {
                ctx.beginPath();
                ctx.moveTo(n.x, n.y);
                ctx.lineTo(e.target.x, e.target.y);
                ctx.strokeStyle = `rgba(96, 165, 250, 0.2)`;
                ctx.lineWidth = e.weight;
                ctx.stroke();
            });
        });

        // Рисуем узлы
        nodes.forEach(n => {
            let r = 15 + n.energy * 10;
            let baseColor;
            
            if (n.W === -1) baseColor = [30, 41, 59]; // Архивирован (очень темный)
            else if (n.W === 1) baseColor = [100, 116, 139]; // Заморожен (серый)
            else if (n.energy === 0) baseColor = [74, 222, 128]; // Зеленый
            else if (n.energy === 1) baseColor = [96, 165, 250]; // Синий
            else if (n.energy === 2) baseColor = [192, 132, 252]; // Фиолетовый
            else baseColor = [251, 191, 36]; // Золотой

            ctx.beginPath();
            ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
            ctx.fillStyle = `rgb(${baseColor[0]}, ${baseColor[1]}, ${baseColor[2]})`;
            ctx.fill();
            
            ctx.strokeStyle = n.W === 0 ? 'rgba(255,255,255,0.8)' : '#334155';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = n.W === 0 ? '#fff' : '#64748b';
            ctx.font = 'bold 12px monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(n.displayWord, n.x, n.y + r + 15);
        });
    }

    function loop() {
        updateDynamics();
        updatePhysics();
        draw();
        requestAnimationFrame(loop);
    }

    (async () => {
        await initModel();
        loop();
    })();
</script>
</body>
</html>
