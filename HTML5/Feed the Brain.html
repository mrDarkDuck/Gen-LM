<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Dynamic Baby LLM Graph (Concepts)</title>
    <style>
        body { margin: 0; background: #0f172a; color: #fff; font-family: monospace; overflow: hidden; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(15, 23, 42, 0.9); padding: 20px; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 340px;}
        input[type="text"] { width: 100%; padding: 10px; background: #1e293b; border: 1px solid #475569; color: #fff; font-family: monospace; border-radius: 6px; box-sizing: border-box; margin-bottom: 10px;}
        button { width: 100%; padding: 10px; background: #3b82f6; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s;}
        button:hover { background: #2563eb; }
        button:disabled { background: #475569; cursor: not-allowed; }
        #log { margin-top: 15px; font-size: 12px; color: #94a3b8; height: 150px; overflow-y: auto; border-top: 1px solid #334155; padding-top: 10px;}
        #status { font-size: 11px; color: #fbbf24; margin-bottom: 10px; min-height: 15px;}
        
        .slider-container { margin: 15px 0; font-size: 12px; color: #cbd5e1; }
        input[type="range"] { width: 100%; margin-top: 5px; cursor: pointer; }
        .slider-val { color: #60a5fa; font-weight: bold; float: right;}
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="ui">
        <h3 style="margin-top:0;">Feed the Brain</h3>
        <div id="status">Loading embedding model...</div>
        <input type="text" id="wordInput" placeholder="Enter text (e.g. 'tokio is a city')" autocomplete="off" disabled>
        <button id="feedBtn" disabled>Learn & Trigger</button>
        
        <div class="slider-container">
            Merge Threshold <span id="thresholdVal" class="slider-val">0.70</span>
            <input type="range" id="thresholdSlider" min="0.4" max="0.95" step="0.01" value="0.70" disabled>
        </div>
        <div id="log"><div>[System] Neural network initialized...</div></div>
    </div>
    <canvas id="canvas"></canvas>

<script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';
    env.allowLocalModels = false;

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('status');
    const inputEl = document.getElementById('wordInput');
    const feedBtn = document.getElementById('feedBtn');
    const slider = document.getElementById('thresholdSlider');
    const thresholdVal = document.getElementById('thresholdVal');
    let mergeThreshold = 0.70;

    let width, height;
    let nodes = [];
    let nextId = 0;
    let extractor = null;
    let isProcessing = false;
    let conceptCounter = 1; // Счетчик для красивых имен концептов

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    function log(msg) {
        let div = document.createElement('div');
        div.innerText = "> " + msg;
        logEl.appendChild(div);
        logEl.scrollTop = logEl.scrollHeight;
    }

    async function initModel() {
        try {
            log("Downloading MiniLM model...");
            extractor = await pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2', { quantized: true });
            statusEl.innerText = "✅ Model loaded.";
            inputEl.disabled = false;
            feedBtn.disabled = false;
            slider.disabled = false;
        } catch (e) {
            statusEl.innerText = "❌ Error loading model.";
            console.error(e);
        }
    }

    function cosineSimilarity(vecA, vecB) {
        let dot = 0, magA = 0, magB = 0;
        for (let i = 0; i < vecA.length; i++) {
            dot += vecA[i] * vecB[i];
            magA += vecA[i] * vecA[i];
            magB += vecB[i] * vecB[i];
        }
        if (magA === 0 || magB === 0) return 0;
        return dot / (Math.sqrt(magA) * Math.sqrt(magB));
    }

    class Node {
        constructor(word, vec, energy=0) {
            this.id = nextId++;
            this.word = word; // Оригинальное имя (может быть длинным)
            this.displayWord = word; // Имя для отображения
            this.vec = vec;
            this.energy = energy;
            this.activation = 0;
            this.W = false;
            this.edges = [];
            this.x = width/2 + (Math.random()-0.5)*400;
            this.y = height/2 + (Math.random()-0.5)*400;
            this.vx = 0; this.vy = 0;
        }
    }

    async function getEmbedding(text) {
        if (!extractor) return null;
        try {
            const output = await extractor(text, { pooling: 'mean', normalize: true });
            return Array.from(output.data);
        } catch (e) { return null; }
    }

    async function addWord(word) {
        let existing = nodes.find(n => n.word === word && !n.W);
        if (!existing) {
            let vec = await getEmbedding(word);
            if (!vec) return null;
            existing = new Node(word, vec);
            nodes.push(existing);
            log(`✨ Embedded: "${word}"`);
        }
        return existing;
    }

    async function addEdge(w1, w2) {
        let n1 = await addWord(w1);
        let n2 = await addWord(w2);
        if (!n1 || !n2) return;
        let existing = n1.edges.find(e => e.target.id === n2.id);
        if (existing) { existing.weight += 0.5; }
        else { 
            n1.edges.push({target: n2, weight: 1}); 
            n2.edges.push({target: n1, weight: 1}); 
        }
    }

    async function feedText() {
        if (isProcessing || !extractor) return;
        let input = inputEl.value.toLowerCase().trim();
        if (!input) return;
        isProcessing = true;
        feedBtn.disabled = true;
        statusEl.innerText = "Computing embeddings...";
        
        try {
            let words = input.split(/\s+/);
            for (let i = 0; i < words.length; i++) {
                for (let j = i+1; j < Math.min(i+3, words.length); j++) {
                    await addEdge(words[i], words[j]);
                }
            }
            let targetWord = words.find(w => w.length > 2) || words[0]; 
            let targetNode = nodes.find(n => n.word === targetWord && !n.W);
            if (targetNode) targetNode.activation = 100;
            inputEl.value = '';
        } catch (e) { console.error(e); } 
        finally {
            isProcessing = false;
            statusEl.innerText = "✅ Ready.";
            feedBtn.disabled = false;
        }
    }

    feedBtn.addEventListener('click', feedText);
    inputEl.addEventListener('keypress', (e) => { if (e.key === 'Enter') feedText(); });
    slider.addEventListener('input', (e) => {
        mergeThreshold = parseFloat(e.target.value);
        thresholdVal.innerText = mergeThreshold.toFixed(2);
    });

    function updateDynamics() {
        nodes.forEach(n => {
            if (!n.W) {
                n.activation *= 0.92;
                if (n.activation < 0.1) n.activation = 0;
            }
        });
        nodes.forEach(n => {
            if (n.activation > 10 && !n.W) {
                let degree = Math.max(1, n.edges.length);
                n.edges.forEach(e => {
                    let transfer = n.activation * 0.15 * (e.weight / degree);
                    e.target.activation += transfer;
                });
                n.activation *= 0.8; 
            }
        });

        let merged = false;
        for (let i = 0; i < nodes.length; i++) {
            for (let j = i+1; j < nodes.length; j++) {
                let n1 = nodes[i], n2 = nodes[j];
                // Не даем сливаться бесконечно (макс энергия 3)
                if (n1.W || n2.W || n1.energy !== n2.energy || n1.energy >= 3) continue;
                
                let sim = cosineSimilarity(n1.vec, n2.vec);
                if (sim > mergeThreshold) {
                    let newNode = new Node(`(${n1.word}+${n2.word})`, n1.vec.map((v, idx) => (v + n2.vec[idx]) / 2), n1.energy + 1);
                    
                    // --- УМНЫЕ ПОДПИСИ ---
                    if (newNode.energy === 1) {
                        newNode.displayWord = `E1_Concept`; // Просто "Концепт"
                    } else if (newNode.energy === 2) {
                        newNode.displayWord = `E2_Meta`;
                    } else {
                        newNode.displayWord = `E3_Abstract`;
                    }

                    newNode.x = (n1.x + n2.x) / 2;
                    newNode.y = (n1.y + n2.y) / 2;
                    n1.W = true; n2.W = true;
                    
                    [...n1.edges, ...n2.edges].forEach(e => {
                        if (!e.target.W && e.target !== n1 && e.target !== n2) {
                            newNode.edges.push({target: e.target, weight: e.weight});
                            e.target.edges.push({target: newNode, weight: e.weight});
                        }
                    });
                    nodes.push(newNode);
                    log(`🧬 MERGED: ${n1.word} + ${n2.word} -> ${newNode.displayWord} (Sim: ${sim.toFixed(2)})`);
                    merged = true;
                    break;
                }
            }
            if (merged) break;
        }
    }

    function updatePhysics() {
        for (let i = 0; i < nodes.length; i++) {
            for (let j = i + 1; j < nodes.length; j++) {
                let dx = nodes[i].x - nodes[j].x;
                let dy = nodes[i].y - nodes[j].y;
                let dist = Math.sqrt(dx*dx + dy*dy) || 1;
                let force = 2000 / (dist * dist);
                nodes[i].vx += (dx/dist) * force; nodes[i].vy += (dy/dist) * force;
                nodes[j].vx -= (dx/dist) * force; nodes[j].vy -= (dy/dist) * force;
            }
        }
        nodes.forEach(n => {
            n.edges.forEach(e => {
                let dx = e.target.x - n.x;
                let dy = e.target.y - n.y;
                let dist = Math.sqrt(dx*dx + dy*dy) || 1;
                let force = (dist - 120) * 0.02;
                n.vx += (dx/dist) * force; n.vy += (dy/dist) * force;
                e.target.vx -= (dx/dist) * force; e.target.vy -= (dy/dist) * force;
            });
        });
        nodes.forEach(n => {
            n.x += n.vx; n.y += n.vy;
            n.vx *= 0.85; n.vy *= 0.85;
            n.x = Math.max(30, Math.min(width - 30, n.x));
            n.y = Math.max(30, Math.min(height - 30, n.y));
        });
    }

    function draw() {
        ctx.clearRect(0, 0, width, height);
        nodes.forEach(n => {
            n.edges.forEach(e => {
                ctx.beginPath();
                ctx.moveTo(n.x, n.y);
                ctx.lineTo(e.target.x, e.target.y);
                let glow = Math.min(n.activation, e.target.activation) / 100;
                ctx.strokeStyle = `rgba(96, 165, 250, ${0.1 + glow * 0.8})`;
                ctx.lineWidth = 1 + glow * 3;
                ctx.stroke();
            });
        });

        nodes.forEach(n => {
            let r = 15 + n.energy * 12;
            
            // Цвета по слоям
            let baseColor;
            if (n.W) baseColor = [71, 85, 105]; // Серый (мертвый)
            else if (n.energy === 0) baseColor = [74, 222, 128]; // Зеленый (база)
            else if (n.energy === 1) baseColor = [96, 165, 250]; // Синий (E1)
            else if (n.energy === 2) baseColor = [167, 139, 250]; // Фиолетовый (E2)
            else baseColor = [251, 191, 36]; // Золотой (E3)

            let glow = Math.min(n.activation / 50, 1);
            let rC = baseColor[0] + (255 - baseColor[0]) * glow;
            let gC = baseColor[1] + (255 - baseColor[1]) * glow;
            let bC = baseColor[2] + (255 - baseColor[2]) * glow;

            ctx.beginPath();
            ctx.arc(n.x, n.y, r + glow * 10, 0, Math.PI * 2);
            ctx.fillStyle = `rgb(${rC}, ${gC}, ${bC})`;
            ctx.fill();
            
            if (glow > 0) {
                ctx.strokeStyle = `rgba(255,255,255,${glow})`;
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            // Рисуем красивую подпись
            ctx.fillStyle = n.W ? '#475569' : '#fff';
            ctx.font = 'bold 12px monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(n.displayWord, n.x, n.y + r + 15);
        });
    }

    function loop() {
        updateDynamics();
        updatePhysics();
        draw();
        requestAnimationFrame(loop);
    }

    (async () => {
        await initModel();
        if (extractor) {
            const text = "moscow is a city . beijing is a city . london is a city . apple is a fruit . banana is a fruit";
            let words = text.split(" ");
            for (let i = 0; i < words.length; i++) {
                for (let j = i+1; j < Math.min(i+3, words.length); j++) {
                    await addEdge(words[i], words[j]);
                }
            }
            log("Base graph ready.");
        }
        loop();
    })();
</script>
</body>
</html>
