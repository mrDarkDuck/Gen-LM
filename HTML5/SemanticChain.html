<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Semantic Chain — Connect the Unconnectable</title>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --text: #f8fafc; --accent: #3b82f6; --success: #4ade80; --error: #f87171; --gold: #fbbf24; --purple: #c084fc; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        /* ===== ЛЕВАЯ ПАНЕЛЬ ===== */
        #sidebar { width: 380px; background: var(--panel); padding: 25px; display: flex; flex-direction: column; border-right: 1px solid #334155; box-shadow: 5px 0 20px rgba(0,0,0,0.3); z-index: 10; overflow-y: auto; }
        .header-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 5px; }
        h1 { margin: 0; font-size: 22px; color: var(--accent); font-family: monospace; }
        
        select.lang-select { background: var(--bg); color: #fff; border: 1px solid #475569; padding: 4px 8px; border-radius: 6px; font-family: inherit; font-size: 12px; cursor: pointer; outline: none; }
        
        .subtitle { font-size: 12px; color: #94a3b8; margin-bottom: 20px; line-height: 1.4; }
        
        .stats { display: flex; gap: 10px; margin-bottom: 20px; }
        .stat-box { flex: 1; background: var(--bg); padding: 10px; border-radius: 8px; border: 1px solid #334155; text-align: center; }
        .stat-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 20px; font-weight: bold; color: var(--accent); font-family: monospace; }
        
        input[type="text"] { width: 100%; padding: 14px; background: var(--bg); border: 1px solid #475569; color: #fff; border-radius: 8px; font-size: 16px; font-family: inherit; outline: none; box-sizing: border-box; margin-bottom: 10px; transition: border-color 0.2s;}
        input[type="text"]:focus { border-color: var(--accent); }
        input[type="text"]:disabled { opacity: 0.5; }
        
        button { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-bottom: 10px; font-family: inherit;}
        button:hover { background: #2563eb; }
        button:disabled { background: #475569; cursor: not-allowed; }
        
        .btn-row { display: flex; gap: 10px; }
        .btn-row button { flex: 1; }
        .btn-secondary { background: #475569; }
        .btn-secondary:hover { background: #64748b; }
        .btn-warning { background: #f59e0b; }
        .btn-warning:hover { background: #d97706; }
        
        #log { font-size: 12px; color: #94a3b8; font-family: monospace; margin-top: 15px; max-height: 200px; overflow-y: auto; border-top: 1px solid #334155; padding-top: 10px; }
        .log-entry { padding: 3px 0; }
        .log-success { color: var(--success); }
        .log-error { color: var(--error); }
        .log-info { color: var(--gold); }
        
        #status { font-size: 12px; color: var(--gold); font-family: monospace; padding: 10px; background: var(--bg); border-radius: 6px; text-align: center; margin-top: 15px;}

        /* ===== ПРАВАЯ ПАНЕЛЬ ===== */
        #board { flex: 1; padding: 40px; overflow: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        
        #mission { position: absolute; top: 30px; left: 0; right: 0; text-align: center; }
        #mission h2 { font-size: 22px; margin: 0; }
        #mission h2 span { color: var(--gold); }
        
        #chain-container { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; justify-content: center; padding: 20px; max-width: 90%; }
        
        .chain-node { 
            background: var(--panel); border: 2px solid #475569; border-radius: 12px; padding: 15px 20px; 
            font-weight: bold; font-size: 16px; animation: pop 0.4s ease-out; position: relative; min-width: 80px; text-align: center;
        }
        .chain-node.start { border-color: var(--success); color: var(--success); }
        .chain-node.target { border-color: var(--error); color: var(--error); }
        .chain-node.bridge { border-color: var(--accent); color: var(--accent); }
        
        @keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .chain-link { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: #64748b; }
        .chain-link .line { height: 2px; width: 40px; background: #475569; position: relative; }
        .chain-link .line::after { content: '>'; position: absolute; right: -5px; top: -7px; color: #475569; }
        .chain-link .sim-badge { color: var(--gold); font-weight: bold; font-size: 11px; }
        
        #victory-screen { 
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.95);
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; animation: fadeIn 0.5s ease-out;
        }
        #victory-screen.show { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .victory-title { font-size: 48px; margin-bottom: 20px; color: var(--gold); text-shadow: 0 0 30px rgba(251,191,36,0.5); }
        .victory-text { font-size: 20px; margin-bottom: 30px; color: #cbd5e1; }
        .victory-stats { display: flex; gap: 30px; margin-bottom: 30px; }
        .victory-stat { text-align: center; }
        .victory-stat .val { font-size: 36px; color: var(--success); font-weight: bold; }
        .victory-stat .lbl { font-size: 12px; color: #94a3b8; text-transform: uppercase; }
        
        #loading-screen { 
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 200;
        }
        #loading-screen.hidden { display: none; }
        .spinner { width: 50px; height: 50px; border: 4px solid #334155; border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;}
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .threshold-info { font-size: 11px; color: #64748b; text-align: center; margin-top: 15px; padding: 8px; background: var(--bg); border-radius: 6px; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="header-row">
            <h1 id="uiTitle">Semantic Chain</h1>
            <select class="lang-select" id="langSelect">
                <option value="ru">RU</option>
                <option value="en">EN</option>
            </select>
        </div>
        <p class="subtitle" id="uiSubtitle">Соедини два далёких слова через семантические мосты.</p>
        
        <div class="stats">
            <div class="stat-box">
                <div class="stat-label" id="uiStepLabel">Шагов</div>
                <div class="stat-value" id="stepCount">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label" id="uiLimitLabel">Лимит</div>
                <div class="stat-value" id="stepLimit">5</div>
            </div>
            <div class="stat-box">
                <div class="stat-label" id="uiScoreLabel">Очки</div>
                <div class="stat-value" id="scoreCount">0</div>
            </div>
        </div>
        
        <input type="text" id="wordInput" placeholder="Введите слово-мост..." autocomplete="off" disabled>
        <button id="submitBtn" disabled id="uiAddBtn">Добавить в цепочку</button>
        
        <div class="btn-row">
            <button id="undoBtn" class="btn-secondary" disabled id="uiUndoBtn">Отменить</button>
            <button id="resetBtn" class="btn-warning" disabled id="uiResetBtn">Сброс</button>
        </div>
        
        <div class="threshold-info" id="uiThresholdInfo">
            Порог связи: <b>0.50</b> (Честная игра)
        </div>
        
        <div id="log"></div>
        <div id="status">Загрузка модели...</div>
    </div>

    <div id="board">
        <div id="loading-screen">
            <div class="spinner"></div>
            <div id="uiLoadingText">Загрузка мультиязычной нейросети...</div>
        </div>
        
        <div id="mission">
            <h2><span id="uiConnectText">Соедини</span> <span id="startWordDisplay">?</span> <span id="uiAndText">и</span> <span id="targetWordDisplay">?</span></h2>
        </div>
        
        <div id="chain-container"></div>
        
        <div id="victory-screen">
            <div class="victory-title" id="uiVictoryTitle">🏆 ЦЕПОЧКА ЗАМКНУТА!</div>
            <div class="victory-text" id="uiVictoryText">Ты связал несовместимое</div>
            <div class="victory-stats">
                <div class="victory-stat">
                    <div class="val" id="victorySteps">0</div>
                    <div class="lbl" id="uiVictoryStepsLbl">Шагов</div>
                </div>
                <div class="victory-stat">
                    <div class="val" id="victoryScore">0</div>
                    <div class="lbl" id="uiVictoryScoreLbl">Очков</div>
                </div>
            </div>
            <button onclick="game.nextLevel()" style="max-width: 300px;" id="uiNextLevelBtn">Следующий уровень →</button>
        </div>
    </div>

<script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';
    env.allowLocalModels = false;

    // ============================================================
    // ЛОКАЛИЗАЦИЯ (СЛОВАРИ)
    // ============================================================
    const TRANSLATIONS = {
        ru: {
            title: "Semantic Chain",
            subtitle: "Соедини два далёких слова через семантические мосты. Чем короче цепочка — тем больше очков.",
            step: "Шагов", limit: "Лимит", score: "Очки",
            placeholder: "Введите слово-мост...",
            addBtn: "Добавить в цепочку", undoBtn: "Отменить", resetBtn: "Сброс",
            connect: "Соедини", and: "и",
            threshold: "Порог связи: <b>0.50</b> (Честная игра)",
            loading: "Загрузка мультиязычной нейросети...",
            ready: "✅ Готово! Введите слово-мост.",
            victoryTitle: "🏆 ЦЕПОЧКА ЗАМКНУТА!",
            victoryText: "Ты связал несовместимое",
            nextLevel: "Следующий уровень →",
            logStart: (i, sim) => `Уровень ${i + 1}. Прямое сходство: ${sim}`,
            logLimit: "Лимит шагов исчерпан. Нажми Сброс.",
            logExists: (w) => `"${w}" уже в цепочке.`,
            logTooFar: (w, a, s, t) => `"${w}" далёк от "${a}" (${s} < ${t})`,
            logJoined: (w, a, s) => `✓ "${w}" присоединён к "${a}" (sim: ${s})`,
            logUndo: (w) => `Отменено: "${w}"`,
            logReset: "Уровень сброшен.",
            logWin: (s) => `🏆 ПОБЕДА! Связь с целью: ${s}`
        },
        en: {
            title: "Semantic Chain",
            subtitle: "Connect two distant words through semantic bridges. The shorter the chain, the more points.",
            step: "Steps", limit: "Limit", score: "Score",
            placeholder: "Enter bridge word...",
            addBtn: "Add to chain", undoBtn: "Undo", resetBtn: "Reset",
            connect: "Connect", and: "and",
            threshold: "Threshold: <b>0.50</b> (Fair play)",
            loading: "Loading multilingual neural network...",
            ready: "✅ Ready! Enter a bridge word.",
            victoryTitle: "🏆 CHAIN CLOSED!",
            victoryText: "You connected the unconnectable",
            nextLevel: "Next Level →",
            logStart: (i, sim) => `Level ${i + 1}. Direct similarity: ${sim}`,
            logLimit: "Step limit reached. Click Reset.",
            logExists: (w) => `"${w}" is already in the chain.`,
            logTooFar: (w, a, s, t) => `"${w}" is too far from "${a}" (${s} < ${t})`,
            logJoined: (w, a, s) => `✓ "${w}" joined "${a}" (sim: ${s})`,
            logUndo: (w) => `Undone: "${w}"`,
            logReset: "Level reset.",
            logWin: (s) => `🏆 VICTORY! Target similarity: ${s}`
        }
    };

    // ============================================================
    // УРОВНИ (на двух языках)
    // ============================================================
    const LEVELS = [
        { ru: { start: "луна", target: "банан" }, en: { start: "moon", target: "banana" }, limit: 4 },
        { ru: { start: "океан", target: "огонь" }, en: { start: "ocean", target: "fire" }, limit: 4 },
        { ru: { start: "библиотека", target: "желудок" }, en: { start: "library", target: "stomach" }, limit: 5 },
        { ru: { start: "гитара", target: "вулкан" }, en: { start: "guitar", target: "volcano" }, limit: 5 },
        { ru: { start: "снег", target: "демократия" }, en: { start: "snow", target: "democracy" }, limit: 6 }
    ];

    // Элементы UI
    const inputEl = document.getElementById('wordInput');
    const submitBtn = document.getElementById('submitBtn');
    const undoBtn = document.getElementById('undoBtn');
    const resetBtn = document.getElementById('resetBtn');
    const statusEl = document.getElementById('status');
    const logEl = document.getElementById('log');
    const chainContainer = document.getElementById('chain-container');
    const stepCountEl = document.getElementById('stepCount');
    const stepLimitEl = document.getElementById('stepLimit');
    const scoreCountEl = document.getElementById('scoreCount');
    const startWordDisplay = document.getElementById('startWordDisplay');
    const targetWordDisplay = document.getElementById('targetWordDisplay');
    const victoryScreen = document.getElementById('victory-screen');
    const loadingScreen = document.getElementById('loading-screen');
    const langSelect = document.getElementById('langSelect');

    let currentLang = 'ru';

    // Функция обновления текста интерфейса
        function updateUILanguage() {
        const t = TRANSLATIONS[currentLang];
        document.getElementById('uiTitle').textContent = t.title;
        document.getElementById('uiSubtitle').textContent = t.subtitle;
        document.getElementById('uiStepLabel').textContent = t.step;
        document.getElementById('uiLimitLabel').textContent = t.limit;
        document.getElementById('uiScoreLabel').textContent = t.score;
        inputEl.placeholder = t.placeholder;
        
        // ИСПРАВЛЕНИЕ: Используем правильные ID кнопок, которые есть в HTML
        document.getElementById('submitBtn').textContent = t.addBtn;
        document.getElementById('undoBtn').textContent = t.undoBtn;
        document.getElementById('resetBtn').textContent = t.resetBtn;
        
        document.getElementById('uiConnectText').textContent = t.connect;
        document.getElementById('uiAndText').textContent = t.and;
        document.getElementById('uiThresholdInfo').innerHTML = t.threshold;
        document.getElementById('uiLoadingText').textContent = t.loading;
        document.getElementById('uiVictoryTitle').textContent = t.victoryTitle;
        document.getElementById('uiVictoryText').textContent = t.victoryText;
        document.getElementById('uiVictoryStepsLbl').textContent = t.step;
        document.getElementById('uiVictoryScoreLbl').textContent = t.score;
        document.getElementById('uiNextLevelBtn').textContent = t.nextLevel;
        
        // Статус обновляем только если модель еще не загрузилась
        if (!statusEl.textContent.includes('✅')) {
            statusEl.textContent = 'Загрузка...';
        }
    }

    class SemanticChainGame {
        constructor(embedder) {
            this.embedder = embedder;
            this.threshold = 0.50;
            this.levelIndex = 0;
            this.chain = [];        
            this.startVec = null;
            this.targetVec = null;
            this.totalScore = 0;
        }

        async startLevel(index) {
            if (index >= LEVELS.length) {
                alert(currentLang === 'ru' ? "🎉 Ты прошёл все уровни! Общий счёт: " + this.totalScore : "🎉 You passed all levels! Total score: " + this.totalScore);
                this.levelIndex = 0;
                this.totalScore = 0;
                index = 0;
            }
            
            this.levelIndex = index;
            this.chain = [];
            victoryScreen.classList.remove('show');

            const level = LEVELS[index][currentLang]; // Берем слова на нужном языке
            const limit = LEVELS[index].limit;
            
            this.startVec = await this.getEmbedding(level.start);
            this.targetVec = await this.getEmbedding(level.target);
            
            startWordDisplay.textContent = level.start;
            targetWordDisplay.textContent = level.target;
            stepLimitEl.textContent = limit;
            stepCountEl.textContent = 0;
            scoreCountEl.textContent = 0;
            
            const directSim = cosineSimilarity(this.startVec, this.targetVec);
            this.log(TRANSLATIONS[currentLang].logStart(index, directSim.toFixed(2)), 'log-info');
            
            this.renderChain();
        }

        async getEmbedding(text) {
            const output = await this.embedder(text, { pooling: 'mean', normalize: true });
            return Array.from(output.data);
        }

        async addWord(word) {
            word = word.toLowerCase().trim();
            if (!word) return;
            
            const level = LEVELS[this.levelIndex][currentLang];
            const limit = LEVELS[this.levelIndex].limit;
            const t = TRANSLATIONS[currentLang];

            if (this.chain.length >= limit) {
                this.log(t.logLimit, 'log-error');
                return;
            }
            
            if (this.chain.some(n => n.word === word) || word === level.start || word === level.target) {
                this.log(t.logExists(word), 'log-error');
                return;
            }
            
            const vec = await this.getEmbedding(word);
            
            const anchorVec = this.chain.length === 0 ? this.startVec : this.chain[this.chain.length - 1].vec;
            const anchorWord = this.chain.length === 0 ? level.start : this.chain[this.chain.length - 1].word;
            
            const simToAnchor = cosineSimilarity(anchorVec, vec);
            
            if (simToAnchor < this.threshold) {
                this.log(t.logTooFar(word, anchorWord, simToAnchor.toFixed(2), this.threshold), 'log-error');
                return;
            }
            
            this.chain.push({ word, vec, simFromPrev: simToAnchor });
            this.log(t.logJoined(word, anchorWord, simToAnchor.toFixed(2)), 'log-success');
            
            const simToTarget = cosineSimilarity(vec, this.targetVec);
            
            this.renderChain();
            this.updateStats();
            
            if (simToTarget >= this.threshold) {
                this.onVictory(simToTarget);
            }
        }

        undo() {
            if (this.chain.length === 0) return;
            const removed = this.chain.pop();
            this.log(TRANSLATIONS[currentLang].logUndo(removed.word), 'log-info');
            this.renderChain();
            this.updateStats();
        }

        async reset() {
            this.log(TRANSLATIONS[currentLang].logReset, 'log-info');
            await this.startLevel(this.levelIndex);
        }

        onVictory(simToTarget) {
            const limit = LEVELS[this.levelIndex].limit;
            const stepsUsed = this.chain.length;
            const stepsLeft = limit - stepsUsed;
            
            const levelScore = 100 + (stepsLeft * 50);
            this.totalScore += levelScore;
            
            this.log(TRANSLATIONS[currentLang].logWin(simToTarget.toFixed(2)), 'log-success');
            
            document.getElementById('victorySteps').textContent = stepsUsed;
            document.getElementById('victoryScore').textContent = levelScore;
            victoryScreen.classList.add('show');
        }

        renderChain() {
            const level = LEVELS[this.levelIndex][currentLang];
            let html = '';
            
            html += `<div class="chain-node start">${level.start}</div>`;
            
            this.chain.forEach((node) => {
                html += `<div class="chain-link">
                            <div class="sim-badge">${node.simFromPrev.toFixed(2)}</div>
                            <div class="line"></div>
                        </div>`;
                html += `<div class="chain-node bridge">${node.word}</div>`;
            });
            
            const lastNode = this.chain.length > 0 ? this.chain[this.chain.length - 1] : null;
            if (lastNode) {
                const simToTarget = cosineSimilarity(lastNode.vec, this.targetVec);
                const isComplete = simToTarget >= this.threshold;
                html += `<div class="chain-link">
                            <div class="sim-badge">${simToTarget.toFixed(2)}</div>
                            <div class="line" style="background: ${isComplete ? 'var(--success)' : '#475569'};"></div>
                        </div>`;
            } else {
                html += `<div class="chain-link">
                            <div class="sim-badge">?</div>
                            <div class="line" style="background: #475569;"></div>
                        </div>`;
            }
            
            html += `<div class="chain-node target">${level.target}</div>`;
            
            chainContainer.innerHTML = html;
        }

        updateStats() {
            stepCountEl.textContent = this.chain.length;
            scoreCountEl.textContent = this.totalScore;
        }

        nextLevel() {
            this.startLevel(this.levelIndex + 1);
        }

        log(msg, cls = '') {
            const entry = document.createElement('div');
            entry.className = 'log-entry ' + cls;
            entry.textContent = '> ' + msg;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
        }
    }

    function cosineSimilarity(vecA, vecB) {
        let dot = 0, magA = 0, magB = 0;
        for (let i = 0; i < vecA.length; i++) {
            dot += vecA[i] * vecB[i];
            magA += vecA[i] * vecA[i];
            magB += vecB[i] * vecB[i];
        }
        if (magA === 0 || magB === 0) return 0;
        return dot / (Math.sqrt(magA) * Math.sqrt(magB));
    }

    let game = null;

        async function init() {
        try {
            // Показываем прогресс загрузки в консоли и на экране
            const embedder = await pipeline('feature-extraction', 'Xenova/paraphrase-multilingual-MiniLM-L12-v2', { 
                quantized: true,
                progress_callback: (data) => {
                    if (data.status === 'progress') {
                        const percent = Math.round((data.loaded / data.total) * 100);
                        document.getElementById('uiLoadingText').innerHTML = `Загрузка нейросети: ${percent}%<br><span style="font-size:10px; color:#94a3b8;">(${Math.round(data.loaded/1024/1024)} MB / ${Math.round(data.total/1024/1024)} MB)</span>`;
                    }
                }
            });
            
            game = new SemanticChainGame(embedder);
            window.game = game; 
            
            loadingScreen.classList.add('hidden');
            statusEl.textContent = '✅ Готово! Введите слово-мост.';
            statusEl.style.color = '#4ade80';
            
            inputEl.disabled = false;
            submitBtn.disabled = false;
            undoBtn.disabled = false;
            resetBtn.disabled = false;
            
            await game.startLevel(0);
        } catch (e) {
            statusEl.textContent = '❌ Ошибка загрузки модели';
            document.getElementById('uiLoadingText').innerHTML = '❌ Ошибка загрузки. Проверьте интернет.';
            console.error(e);
        }
    }

    // Обработка переключения языка
    langSelect.addEventListener('change', async (e) => {
        currentLang = e.target.value;
        updateUILanguage();
        if (game) {
            await game.startLevel(0); // Сбрасываем на первый уровень
        }
    });

    submitBtn.addEventListener('click', async () => {
        if (!game) return;
        const word = inputEl.value.trim();
        if (!word) return;
        
        inputEl.disabled = true;
        submitBtn.disabled = true;
        
        await game.addWord(word);
        
        inputEl.value = '';
        inputEl.disabled = false;
        submitBtn.disabled = false;
        inputEl.focus();
    });

    inputEl.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') submitBtn.click();
    });

    undoBtn.addEventListener('click', () => { if (game) game.undo(); });
    resetBtn.addEventListener('click', async () => { if (game) await game.reset(); });

    // Инициализация языка по умолчанию
    updateUILanguage();
    init();
</script>
</body>
</html>
